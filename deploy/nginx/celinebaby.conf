# Nginx site for celinebaby.kz. setup-server.sh replaces __HOSTS__ and __MEDIA__;
# certbot --nginx then adds the HTTPS part and the http → https redirect.

upstream celinebaby_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __HOSTS__;

    # www.celinebaby.kz → celinebaby.kz
    if ($host = www.celinebaby.kz) {
        return 301 https://celinebaby.kz$request_uri;
    }

    client_max_body_size 12m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Photos moved from the old site: same addresses as before (celinebaby.kz/image/...)
    location ^~ /image/ {
        alias __MEDIA__/image/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Photos uploaded in the admin (unique file names, never change)
    location ^~ /uploads/ {
        alias __MEDIA__/uploads/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /_next/static/ {
        proxy_pass http://celinebaby_app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://celinebaby_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
